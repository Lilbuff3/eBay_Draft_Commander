<!-- eBay Mobile-Compatible Description Template — inline styles only -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 10px;">

    <!-- Title -->
    <h1 style="font-size: 22px; font-weight: 700; color: #1a1a1a; border-bottom: 2px solid #eaeaea; padding-bottom: 12px; margin: 0 0 16px 0;">{{TITLE}}</h1>

    <!-- Images — stacked vertically for mobile, centered -->
    <div style="margin-bottom: 20px;">
        {{IMAGES}}
    </div>

    <!-- Item Specifics -->
    <h2 style="font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #555; border-bottom: 1px solid #eee; padding-bottom: 5px; margin: 0 0 10px 0;">Item Specifics</h2>
    {{ASPECTS}}

    <!-- Description -->
    <h2 style="font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #555; border-bottom: 1px solid #eee; padding-bottom: 5px; margin: 20px 0 10px 0;">Description</h2>
    <div style="font-size: 15px; margin-bottom: 20px;">
        {{DESCRIPTION}}
    </div>

    <!-- Shipping & Returns -->
    <h2 style="font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #555; border-bottom: 1px solid #eee; padding-bottom: 5px; margin: 0 0 10px 0;">Shipping &amp; Returns</h2>
    <div style="font-size: 15px; margin-bottom: 10px;">
        <p style="margin: 0 0 6px 0;"><strong>Shipping:</strong> Fast, tracked shipping. We ship within 1 business day.</p>
        <p style="margin: 0 0 6px 0;"><strong>Returns:</strong> 30-Day Returns accepted if item is not as described.</p>
        <p style="margin: 0 0 6px 0;"><strong>Condition:</strong> {{CONDITION}}</p>
    </div>

</div>
